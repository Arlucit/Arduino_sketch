; Tetris Weather Clock - ESP32 WROOM + pannello HUB75 64x32
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  mrcodetastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.10
  adafruit/Adafruit GFX Library@^1.11.9
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.0.4
